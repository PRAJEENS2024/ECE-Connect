version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: ece_connect_db
    environment:
      POSTGRES_DB: ece_connect_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ece_password_2026
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ece_connect_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: ece_connect_backend
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    working_dir: /app/backend
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DJANGO_SECRET_KEY=docker-ece-connect-insecure-secret-key-2026
      - DJANGO_DEBUG=True
      - DB_ENGINE=postgresql
      - DB_NAME=ece_connect_db
      - DB_USER=postgres
      - DB_PASSWORD=ece_password_2026
      - DB_HOST=db
      - DB_PORT=5432
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ece_connect_frontend
    command: npm run dev -- --host 0.0.0.0 --port 5173
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  postgres_data:
